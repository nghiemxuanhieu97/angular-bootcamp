<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        .actions { margin-bottom: 16px; }
        button { margin-right: 8px; padding: 8px 12px; cursor: pointer; }
        ul { padding: 0; }
        li { cursor: pointer; list-style: none; margin-bottom: 8px; padding: 10px; border: 1px solid #ccc; }
        li:hover { background: #eee; }
        li.selected { background: yellow; }
        #employeeDetail, #summary { margin-top: 20px; padding: 16px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Employee Management</h1>
    <h2>Employees</h2>
    <div class="actions">
        <button id="showAllButton">Show All</button>
        <button id="showActiveButton">Show Active</button>
    </div>
    <ul id="employeeList"></ul>
    <section id="summary">
        <p>Total Salary: <strong id="totalSalary"></strong></p>
        <p>Active Employees: <strong id="activeEmployeeCount"></strong></p>
    </section>
    <section id="employeeDetail">Select an employee to view details.</section>
    <script src="app.js"></script>
</body>
</html>
